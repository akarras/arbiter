[package]
name = "arbiter-app"
version = "0.1.0"
edition = "2024"
description = "StarCraft II replay APM charts"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arbiter = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

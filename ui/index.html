<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbiter</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside id="sidebar">
  <header>
    <h1>Arbiter</h1>
    <div class="actions">
      <button id="open" type="button">Open file…</button>
      <button id="add" type="button">Add folder…</button>
    </div>
    <input id="filter" type="search" placeholder="Filter by name" autocomplete="off">
    <p id="count" class="meta"></p>
  </header>
  <ul id="list"></ul>
  <footer>
    <p class="meta">Folders</p>
    <pre id="roots"></pre>
    <p id="warning" class="meta warning" hidden></p>
  </footer>
</aside>
<main id="pane">
  <iframe id="chart" sandbox="allow-scripts" title="APM chart"></iframe>
  <div id="status">Select a replay</div>
</main>
<script>
  if (!window.__TAURI__ && new URLSearchParams(location.search).get('mock') === '1') {
    document.write('<script src="mock.js"><\/script>');
  }
</script>
<script src="app.js"></script>
</body>
</html>
